version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NS_MARIADB_USER: uprav
      NS_MARIADB_PASSWORD: uprav_pass
      NS_MARIADB_HOSTNAME: db
      NS_MARIADB_PORT: "3306"
      NS_MARIADB_DATABASE: upravdb
    depends_on:
      - db

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: rootpwd
      MARIADB_DATABASE: upravdb
      MARIADB_USER: uprav
      MARIADB_PASSWORD: uprav_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
